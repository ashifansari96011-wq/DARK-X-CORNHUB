<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DARK-X-CORNHUB</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-main: #09090b;
            --bg-card: #141417;
            --bg-glass: rgba(20, 20, 23, 0.88);
            --brand-orange: #ff9000;
            --brand-red: #ef4444;
            --brand-tg: #24A1DE;
            --text-light: #f4f4f5;
            --text-dim: #a1a1aa;
            --border-color: #27272a;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Outfit', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-light);
            min-height: 100vh;
            overflow-x: hidden;
            padding-bottom: 80px;
        }

        header {
            background: var(--bg-glass);
            backdrop-filter: blur(14px);
            border-bottom: 1px solid var(--border-color);
            padding: 14px 24px;
            position: sticky;
            top: 0;
            z-index: 100;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .brand-logo {
            font-size: 1.6rem;
            font-weight: 800;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            user-select: none;
        }

        .brand-logo .white-txt { color: #ffffff; }
        .brand-logo .hub-box {
            background: var(--brand-orange);
            color: #000000;
            padding: 2px 8px;
            border-radius: 6px;
            margin-left: 3px;
        }

        .search-wrap {
            flex: 1;
            max-width: 450px;
            position: relative;
        }

        .search-wrap input {
            width: 100%;
            background: #1c1c21;
            border: 1px solid var(--border-color);
            color: var(--text-light);
            padding: 10px 16px;
            border-radius: 99px;
            font-size: 0.95rem;
            outline: none;
            transition: 0.25s;
        }

        .search-wrap input:focus {
            border-color: var(--brand-orange);
            box-shadow: 0 0 12px rgba(255, 144, 0, 0.25);
        }

        .categories-bar {
            max-width: 1350px;
            margin: 18px auto 10px;
            padding: 0 20px;
            display: flex;
            gap: 12px;
            overflow-x: auto;
            scrollbar-width: none;
        }
        .categories-bar::-webkit-scrollbar { display: none; }

        .cat-pill {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            color: var(--text-dim);
            padding: 8px 20px;
            border-radius: 99px;
            font-size: 0.9rem;
            font-weight: 700;
            cursor: pointer;
            white-space: nowrap;
            transition: 0.2s;
            letter-spacing: 0.4px;
        }

        .cat-pill.active, .cat-pill:hover {
            background: var(--brand-orange);
            color: #000;
            border-color: var(--brand-orange);
            box-shadow: 0 4px 15px rgba(255, 144, 0, 0.3);
        }

        .container {
            max-width: 1350px;
            margin: 15px auto;
            padding: 0 20px;
        }

        .video-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(310px, 1fr));
            gap: 22px;
        }

        .video-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: transform 0.25s ease, border-color 0.25s ease;
        }

        .video-card:hover {
            transform: translateY(-4px);
            border-color: #3f3f46;
        }

        .video-card.shared-highlight {
            border: 2px solid var(--brand-orange);
            box-shadow: 0 0 25px rgba(255, 144, 0, 0.35);
        }

        .video-card.is-hidden {
            opacity: 0.45;
            border: 1px dashed var(--brand-red);
        }

        .player-wrapper {
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #000;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        video, iframe {
            width: 100%;
            height: 100%;
            border: none;
            object-fit: contain;
            background: #000;
        }

        .play-overlay-btn {
            position: absolute;
            background: var(--brand-orange);
            color: #000;
            font-weight: 800;
            padding: 12px 22px;
            border-radius: 99px;
            border: none;
            cursor: pointer;
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 8px 25px rgba(255, 144, 0, 0.4);
            transition: 0.2s;
            z-index: 5;
        }

        .play-overlay-btn:hover { transform: scale(1.06); }

        .badge-size {
            position: absolute;
            bottom: 8px;
            right: 8px;
            background: rgba(0, 0, 0, 0.85);
            color: var(--brand-orange);
            padding: 3px 8px;
            border-radius: 5px;
            font-size: 0.75rem;
            font-weight: 700;
            z-index: 4;
        }

        .card-info {
            padding: 14px 16px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            flex: 1;
        }

        .video-title {
            font-size: 1.02rem;
            font-weight: 600;
            color: var(--text-light);
            line-height: 1.4;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .video-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.8rem;
            color: var(--text-dim);
            margin-top: auto;
        }

        .share-row {
            display: flex;
            gap: 8px;
            padding-top: 8px;
            border-top: 1px solid #222226;
        }

        .share-btn {
            flex: 1;
            background: #1f1f24;
            border: 1px solid #2e2e36;
            color: var(--text-light);
            padding: 7px 10px;
            border-radius: 8px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            transition: 0.2s;
        }

        .share-btn:hover {
            background: var(--brand-orange);
            color: #000;
            border-color: var(--brand-orange);
        }

        .share-btn.tg-btn:hover {
            background: var(--brand-tg);
            color: #fff;
            border-color: var(--brand-tg);
        }

        .card-admin-tools {
            display: none;
            flex-direction: column;
            gap: 8px;
            margin-top: 8px;
            padding-top: 10px;
            border-top: 1px dashed #3f3f46;
        }

        .card-admin-tools input, .card-admin-tools select {
            background: #09090b;
            border: 1px solid #3f3f46;
            color: #fff;
            padding: 7px 10px;
            border-radius: 6px;
            font-size: 0.85rem;
            outline: none;
        }

        .admin-btn-row { display: flex; gap: 6px; }

        .btn-sm {
            flex: 1;
            padding: 7px;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            font-size: 0.8rem;
            cursor: pointer;
        }

        .btn-save { background: var(--brand-orange); color: #000; }
        .btn-hide { background: #27272a; color: #fff; }
        .btn-del { background: var(--brand-red); color: #fff; }

        .secret-gear {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: #18181b;
            border: 1px solid #27272a;
            color: #71717a;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            cursor: pointer;
            z-index: 999;
            opacity: 0.45;
            transition: 0.25s;
            box-shadow: 0 4px 15px rgba(0,0,0,0.6);
        }

        .secret-gear:hover, .secret-gear.active-admin {
            opacity: 1;
            color: var(--brand-orange);
            border-color: var(--brand-orange);
            transform: rotate(45deg);
        }

        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(6px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 20px;
        }

        .modal-box {
            background: #141417;
            border: 1px solid #27272a;
            width: 100%;
            max-width: 520px;
            border-radius: 16px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 12px;
        }

        .modal-header h3 { color: var(--brand-orange); font-size: 1.2rem; }
        .close-btn { background: none; border: none; color: var(--text-dim); font-size: 1.4rem; cursor: pointer; }

        .form-group { display: flex; flex-direction: column; gap: 6px; }
        .form-group label { font-size: 0.85rem; color: var(--text-dim); }
        .form-group input, .form-group select {
            background: #09090b;
            border: 1px solid #3f3f46;
            color: #fff;
            padding: 10px 12px;
            border-radius: 8px;
            outline: none;
        }

        .action-btn {
            background: var(--brand-orange);
            color: #000;
            border: none;
            padding: 11px 16px;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
        }

        .action-btn.secondary { background: #27272a; color: #fff; }

        .status-log {
            background: #09090b;
            border: 1px solid #27272a;
            color: #22c55e;
            padding: 10px;
            border-radius: 8px;
            font-size: 0.8rem;
            font-family: monospace;
            max-height: 110px;
            overflow-y: auto;
            display: none;
        }

        .empty-box {
            grid-column: 1 / -1;
            text-align: center;
            padding: 70px 20px;
            color: var(--text-dim);
        }

        #toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--brand-orange);
            color: #000;
            padding: 10px 22px;
            border-radius: 99px;
            font-weight: 700;
            font-size: 0.9rem;
            display: none;
            z-index: 2000;
            box-shadow: 0 8px 25px rgba(0,0,0,0.6);
        }
    </style>
</head>
<body>

    <header>
        <div class="brand-logo" onclick="resetFilter()">
            <span class="white-txt">DARK-X-</span><span class="hub-box">CORNHUB</span>
        </div>

        <div class="search-wrap">
            <input type="text" id="searchInput" placeholder="Search HANTAI or CORN REAL..." oninput="renderGrid()">
        </div>
    </header>

    <div class="categories-bar">
        <div class="cat-pill active" id="pill_All" onclick="filterCat('All', this)">🔥 ALL VIDEOS</div>
        <div class="cat-pill" id="pill_HANTAI" onclick="filterCat('HANTAI', this)">🎌 HANTAI</div>
        <div class="cat-pill" id="pill_CORN REAL" onclick="filterCat('CORN REAL', this)">🌽 CORN REAL</div>
    </div>

    <div class="container">
        <div class="video-grid" id="videoGrid">
            <div class="empty-box">Loading DARK-X-CORNHUB videos...</div>
        </div>
    </div>

    <div id="toast">Link Copied!</div>

    <div class="secret-gear" id="gearBtn" onclick="openGearMenu()" title="Settings">⚙️</div>

    <div class="modal-overlay" id="adminModal">
        <div class="modal-box" id="loginBox">
            <div class="modal-header">
                <h3>🔒 Admin Access</h3>
                <button class="close-btn" onclick="closeModal()">✖</button>
            </div>
            <div class="form-group">
                <label>Enter Admin Password</label>
                <input type="password" id="adminPassInput" placeholder="Password..." onkeydown="if(event.key==='Enter') verifyAdmin()">
            </div>
            <button class="action-btn" onclick="verifyAdmin()">Unlock Admin Panel</button>
        </div>

        <div class="modal-box" id="dashboardBox" style="display:none;">
            <div class="modal-header">
                <h3>⚙️ DARK-X-CORNHUB Admin</h3>
                <button class="close-btn" onclick="closeModal()">✖</button>
            </div>

            <!-- Bot Auto Sync & Channel Fix -->
            <div class="form-group">
                <label>1. Channel & Bot Sync (Fixes Channel Forward Issue)</label>
                <button class="action-btn" id="syncBtn" onclick="fixAndSyncBot()">⚡ Fix Webhook & Sync Channel Videos</button>
                <div class="status-log" id="syncLog"></div>
                <small style="color:var(--text-dim); font-size:0.75rem;">
                    <b>Important:</b> Channel mein bot ko Admin banate waqt <b>"Post Messages"</b> on rakhein. Button dabane ke baad channel mein 1 naya video forward karein!
                </small>
            </div>

            <hr style="border:0; border-top:1px solid #27272a;">

            <!-- Add Unlimited Size Video -->
            <div class="form-group">
                <label>2. Add Video Manually (Direct Link / Telegram Channel Post Link)</label>
                <input type="text" id="customTitle" placeholder="Video Title...">
                <input type="text" id="customUrl" placeholder="Direct MP4 Link OR Telegram Post Link (e.g. https://t.me/channel/123)">
                <select id="customCat">
                    <option value="CORN REAL">🌽 CORN REAL</option>
                    <option value="HANTAI">🎌 HANTAI</option>
                </select>
                <button class="action-btn" onclick="addManualVideo()">➕ Add Video to Website</button>
            </div>

            <hr style="border:0; border-top:1px solid #27272a;">

            <div class="form-group">
                <label>3. Save Changes for All GitHub Visitors</label>
                <div style="display:flex; gap:8px;">
                    <button class="action-btn secondary" style="flex:1;" onclick="copyGlobalData()">📋 Copy Data JSON</button>
                    <button class="action-btn secondary" style="flex:1; color:#ef4444;" onclick="logoutAdmin()">🔒 Lock Admin</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const BOT_TOKEN = "8864793593:AAGNRUeo59XRw6Lo7lgwuw_18TgOhYL-beQ";
        const ADMIN_PASS = "Ashif@1234";
        const GLOBAL_SAVED_DATA = null;

        let isAdmin = false;
        let activeCategory = "All";
        const urlParams = new URLSearchParams(window.location.search);
        let sharedVideoId = urlParams.get('v');

        let db = JSON.parse(localStorage.getItem('darkx_cornhub_db')) || GLOBAL_SAVED_DATA || {
            videos: {},
            deletedIds: []
        };

        Object.values(db.videos).forEach(v => {
            if (v.category !== "HANTAI" && v.category !== "CORN REAL") {
                v.category = "CORN REAL";
            }
        });

        function saveDB() {
            localStorage.setItem('darkx_cornhub_db', JSON.stringify(db));
        }

        function showToast(msg) {
            const t = document.getElementById('toast');
            t.innerText = msg;
            t.style.display = 'block';
            setTimeout(() => { t.style.display = 'none'; }, 2500);
        }

        function logStatus(msg) {
            const box = document.getElementById('syncLog');
            if (!box) return;
            box.style.display = 'block';
            box.innerHTML += `<div>> ${msg}</div>`;
            box.scrollTop = box.scrollHeight;
        }

        // ==========================================
        // FIX WEBHOOK + FORCE CHANNEL_POST SYNC
        // ==========================================
        async function fixAndSyncBot() {
            const logBox = document.getElementById('syncLog');
            if (logBox) logBox.innerHTML = '';
            logStatus("Removing any old webhook...");

            try {
                await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/deleteWebhook?drop_pending_updates=false`);
                logStatus("Webhook cleared! Requesting channel_post & message updates...");
                await syncBotVideos(false);
            } catch (e) {
                logStatus("Error: " + e.message);
            }
        }

        async function syncBotVideos(silent = false) {
            const syncBtn = document.getElementById('syncBtn');
            if (syncBtn) syncBtn.innerText = "⏳ Syncing Channel & Bot...";

            try {
                // Explicitly ask Telegram for channel_post, edited_channel_post, and message
                const allowed = encodeURIComponent(JSON.stringify(["message", "channel_post", "edited_message", "edited_channel_post"]));
                const res = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/getUpdates?limit=100&allowed_updates=${allowed}`);
                const data = await res.json();

                if (!data.ok) {
                    if (!silent) logStatus("Bot API Error: " + data.description);
                    if (syncBtn) syncBtn.innerText = "⚡ Fix Webhook & Sync Channel Videos";
                    return;
                }

                if (!silent) logStatus(`Total raw updates received from Telegram: ${data.result.length}`);

                let newCount = 0;
                let videoFoundInUpdates = 0;

                for (const item of data.result) {
                    const msg = item.channel_post || item.edited_channel_post || item.message || item.edited_message;
                    if (!msg) continue;

                    // Detect regular video, document video, or animation/gif
                    const videoObj = msg.video ||
                        (msg.document && msg.document.mime_type && msg.document.mime_type.startsWith('video/') ? msg.document : null) ||
                        msg.animation;

                    if (videoObj) {
                        videoFoundInUpdates++;
                        const uniqueId = videoObj.file_unique_id;

                        // If user previously deleted it, restore it if they manually clicked Sync
                        if (!silent && db.deletedIds.includes(uniqueId)) {
                            db.deletedIds = db.deletedIds.filter(id => id !== uniqueId);
                        }
                        if (db.deletedIds.includes(uniqueId)) continue;

                        const sizeMB = videoObj.file_size ? (videoObj.file_size / (1024 * 1024)).toFixed(1) : "HD";
                        const isPublicChannel = msg.chat && msg.chat.username;
                        const tgPostLink = isPublicChannel ? `https://t.me/${msg.chat.username}/${msg.message_id}` : null;
                        const chatTitle = msg.chat && msg.chat.title ? `[${msg.chat.title}] ` : "";
                        const rawTitle = msg.caption || videoObj.file_name || `${chatTitle}DARK-X Video #${msg.message_id}`;

                        const autoCat = rawTitle.toLowerCase().includes("hantai") || rawTitle.toLowerCase().includes("hentai")
                            ? "HANTAI"
                            : "CORN REAL";

                        if (!db.videos[uniqueId]) {
                            db.videos[uniqueId] = {
                                uniqueId: uniqueId,
                                fileId: videoObj.file_id,
                                title: rawTitle,
                                date: new Date(msg.date * 1000).toLocaleDateString(),
                                size: sizeMB === "HD" ? "HD" : sizeMB + " MB",
                                category: autoCat,
                                tgPostLink: tgPostLink,
                                customUrl: null,
                                hidden: false
                            };
                            newCount++;
                        } else {
                            db.videos[uniqueId].fileId = videoObj.file_id;
                            if (tgPostLink) db.videos[uniqueId].tgPostLink = tgPostLink;
                        }
                    }
                }

                saveDB();
                renderGrid();

                if (!silent) {
                    logStatus(`Videos detected in updates: ${videoFoundInUpdates} | Newly added: ${newCount}`);
                    if (videoFoundInUpdates === 0) {
                        logStatus("⚠️ Bot ko abhi tak koi video update nahi mila! Ab apne Channel mein 1 NAYA video forward karein aur phir yeh button dabayein.");
                    } else {
                        showToast(`✅ Synced! (${newCount} New Videos)`);
                    }
                }

                if (syncBtn) {
                    syncBtn.innerText = newCount > 0 ? `✅ Added ${newCount} New Videos!` : "⚡ Fix Webhook & Sync Channel Videos";
                }
            } catch (e) {
                console.error(e);
                if (!silent) logStatus("Network Error: " + e.message);
                if (syncBtn) syncBtn.innerText = "⚡ Fix Webhook & Sync Channel Videos";
            }
        }

        // ==========================================
        // VIDEO STREAMING ENGINE
        // ==========================================
        async function loadAndPlay(uniqueId, btnEl) {
            const v = db.videos[uniqueId];
            if (!v) return;

            const box = document.getElementById(`player_box_${uniqueId}`);
            btnEl.innerText = "⏳ Loading Stream...";

            if (v.customUrl) {
                if (v.customUrl.includes("t.me/")) {
                    renderTelegramEmbed(box, v.customUrl);
                } else {
                    box.innerHTML = `<video src="${v.customUrl}" controls autoplay playsinline></video>`;
                }
                return;
            }

            if (v.fileId) {
                try {
                    const res = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/getFile?file_id=${v.fileId}`);
                    const data = await res.json();

                    if (data.ok && data.result.file_path) {
                        const streamUrl = `https://api.telegram.org/file/bot${BOT_TOKEN}/${data.result.file_path}`;
                        box.innerHTML = `<video src="${streamUrl}" controls autoplay playsinline></video>`;
                        return;
                    }
                } catch (err) {
                    console.error(err);
                }
            }

            if (v.tgPostLink) {
                renderTelegramEmbed(box, v.tgPostLink);
                return;
            }

            alert("⚠️ Yeh video 20MB se bada hai aur Private Channel/Chat se aaya hai!\n\n20MB+ video chalane ke liye apne Channel ko PUBLIC rakhein (taki uska @username ho) ya Admin panel mein Direct Link dalein.");
            btnEl.innerText = "▶️ Play Video";
        }

        function renderTelegramEmbed(container, postUrl) {
            const cleanPath = postUrl.replace("https://t.me/", "").replace("http://t.me/", "").split("?")[0];
            container.innerHTML = `
                <iframe src="https://t.me/${cleanPath}?embed=1&mode=tme" 
                        allowfullscreen 
                        scrolling="no" 
                        style="width:100%; height:100%; border:none; background:#000;">
                </iframe>`;
        }

        // ==========================================
        // SHARE FUNCTIONS
        // ==========================================
        function getShareUrl(uniqueId) {
            const baseUrl = window.location.origin + window.location.pathname;
            return `${baseUrl}?v=${encodeURIComponent(uniqueId)}`;
        }

        async function shareVideo(uniqueId) {
            const v = db.videos[uniqueId];
            if (!v) return;
            const shareUrl = getShareUrl(uniqueId);
            const shareText = `🔥 Watch "${v.title}" (${v.category}) on DARK-X-CORNHUB!`;

            if (navigator.share) {
                try {
                    await navigator.share({ title: 'DARK-X-CORNHUB', text: shareText, url: shareUrl });
                    return;
                } catch (err) {}
            }

            navigator.clipboard.writeText(`${shareText}\n${shareUrl}`).then(() => {
                showToast("🔗 Video Share Link Copied!");
            });
        }

        function shareOnTelegram(uniqueId) {
            const v = db.videos[uniqueId];
            if (!v) return;
            const shareUrl = v.tgPostLink || getShareUrl(uniqueId);
            const text = `🔥 Watch: ${v.title} [${v.category}]\n🎬 DARK-X-CORNHUB`;
            const tgUrl = `https://t.me/share/url?url=${encodeURIComponent(shareUrl)}&text=${encodeURIComponent(text)}`;
            window.open(tgUrl, '_blank');
        }

        // ==========================================
        // RENDER GRID
        // ==========================================
        function renderGrid() {
            const grid = document.getElementById('videoGrid');
            const search = document.getElementById('searchInput').value.toLowerCase();

            let list = Object.values(db.videos).reverse().filter(v => {
                if (!isAdmin && v.hidden) return false;
                if (activeCategory !== "All" && v.category !== activeCategory) return false;
                return v.title.toLowerCase().includes(search);
            });

            if (sharedVideoId && db.videos[sharedVideoId]) {
                list = list.sort((a, b) => (a.uniqueId === sharedVideoId ? -1 : b.uniqueId === sharedVideoId ? 1 : 0));
            }

            if (list.length === 0) {
                grid.innerHTML = `
                    <div class="empty-box">
                        <h2>No Videos Found in ${activeCategory}</h2>
                        <p style="margin-top:8px;">Channel ya Bot mein NAYA video forward karein, ya ⚙️ Settings se Sync karein.</p>
                    </div>`;
                return;
            }

            grid.innerHTML = list.map(v => `
                <div class="video-card ${v.hidden ? 'is-hidden' : ''} ${v.uniqueId === sharedVideoId ? 'shared-highlight' : ''}">
                    <div class="player-wrapper" id="player_box_${v.uniqueId}">
                        <button class="play-overlay-btn" onclick="loadAndPlay('${v.uniqueId}', this)">
                            ▶️ Play Video
                        </button>
                        <span class="badge-size">${escapeHtml(v.size || 'HD')}</span>
                    </div>

                    <div class="card-info">
                        <div class="video-title">${escapeHtml(v.title)}</div>
                        <div class="video-meta">
                            <span>📅 ${v.date}</span>
                            <span style="color:var(--brand-orange); font-weight:700;">
                                ${v.category === 'HANTAI' ? '🎌 HANTAI' : '🌽 CORN REAL'}
                            </span>
                        </div>

                        <div class="share-row">
                            <button class="share-btn" onclick="shareVideo('${v.uniqueId}')">
                                🔗 Share Link
                            </button>
                            <button class="share-btn tg-btn" onclick="shareOnTelegram('${v.uniqueId}')">
                                ✈️ Share to TG
                            </button>
                        </div>

                        <div class="card-admin-tools" style="display: ${isAdmin ? 'flex' : 'none'}">
                            <input type="text" id="title_in_${v.uniqueId}" value="${escapeHtml(v.title)}" placeholder="Edit Title...">
                            <select id="cat_in_${v.uniqueId}">
                                <option value="CORN REAL" ${v.category === 'CORN REAL' ? 'selected' : ''}>🌽 CORN REAL</option>
                                <option value="HANTAI" ${v.category === 'HANTAI' ? 'selected' : ''}>🎌 HANTAI</option>
                            </select>
                            <input type="text" id="url_in_${v.uniqueId}" value="${escapeHtml(v.customUrl || v.tgPostLink || '')}" placeholder="Optional: Direct MP4 or t.me/channel/123 link">
                            <div class="admin-btn-row">
                                <button class="btn-sm btn-save" onclick="saveCardEdits('${v.uniqueId}')">💾 Save</button>
                                <button class="btn-sm btn-hide" onclick="toggleHideVideo('${v.uniqueId}')">${v.hidden ? '👁️ Show' : '🙈 Hide'}</button>
                                <button class="btn-sm btn-del" onclick="deleteVideoItem('${v.uniqueId}')">🗑️ Delete</button>
                            </div>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function filterCat(cat, el) {
            activeCategory = cat;
            sharedVideoId = null;
            document.querySelectorAll('.cat-pill').forEach(p => p.classList.remove('active'));
            if (el) el.classList.add('active');
            renderGrid();
        }

        function resetFilter() {
            filterCat('All', document.getElementById('pill_All'));
        }

        function openGearMenu() {
            document.getElementById('adminModal').style.display = 'flex';
            if (isAdmin) {
                document.getElementById('loginBox').style.display = 'none';
                document.getElementById('dashboardBox').style.display = 'flex';
            } else {
                document.getElementById('loginBox').style.display = 'flex';
                document.getElementById('dashboardBox').style.display = 'none';
                document.getElementById('adminPassInput').focus();
            }
        }

        function closeModal() {
            document.getElementById('adminModal').style.display = 'none';
        }

        function verifyAdmin() {
            const pass = document.getElementById('adminPassInput').value;
            if (pass === ADMIN_PASS) {
                isAdmin = true;
                document.getElementById('adminPassInput').value = '';
                document.getElementById('gearBtn').classList.add('active-admin');
                document.getElementById('loginBox').style.display = 'none';
                document.getElementById('dashboardBox').style.display = 'flex';
                renderGrid();
            } else {
                alert("❌ Wrong Admin Password!");
            }
        }

        function logoutAdmin() {
            isAdmin = false;
            document.getElementById('gearBtn').classList.remove('active-admin');
            closeModal();
            renderGrid();
        }

        function addManualVideo() {
            const title = document.getElementById('customTitle').value.trim();
            const url = document.getElementById('customUrl').value.trim();
            const cat = document.getElementById('customCat').value;

            if (!title || !url) {
                alert("Please enter both Title and Video Link!");
                return;
            }

            const id = "custom_" + Date.now();
            db.videos[id] = {
                uniqueId: id,
                fileId: null,
                title: title,
                date: new Date().toLocaleDateString(),
                size: "FULL HD",
                category: cat,
                customUrl: url,
                hidden: false
            };

            saveDB();
            renderGrid();
            document.getElementById('customTitle').value = '';
            document.getElementById('customUrl').value = '';
            showToast("✅ Video Added Successfully!");
        }

        function saveCardEdits(id) {
            const newTitle = document.getElementById(`title_in_${id}`).value.trim();
            const newCat = document.getElementById(`cat_in_${id}`).value;
            const newUrl = document.getElementById(`url_in_${id}`).value.trim();
            if (db.videos[id]) {
                if (newTitle) db.videos[id].title = newTitle;
                db.videos[id].category = newCat;
                db.videos[id].customUrl = newUrl || null;
                saveDB();
                renderGrid();
                showToast("💾 Video Updated!");
            }
        }

        function toggleHideVideo(id) {
            if (db.videos[id]) {
                db.videos[id].hidden = !db.videos[id].hidden;
                saveDB();
                renderGrid();
            }
        }

        function deleteVideoItem(id) {
            if (confirm("Delete this video permanently from website?")) {
                delete db.videos[id];
                if (!db.deletedIds.includes(id)) db.deletedIds.push(id);
                saveDB();
                renderGrid();
            }
        }

        function copyGlobalData() {
            navigator.clipboard.writeText(JSON.stringify(db)).then(() => {
                alert("✅ Copied!\n\nPaste this in place of 'null' at 'const GLOBAL_SAVED_DATA = null;' inside index.html so all GitHub visitors see your customized videos.");
            });
        }

        function escapeHtml(str) {
            return String(str || '').replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));
        }

        window.onload = () => {
            renderGrid();
            syncBotVideos(true);
        };
    </script>
</body>
</html>
